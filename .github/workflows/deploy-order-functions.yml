[200~name: Deploy Serverless Order Processing Function

on:
  push:
    branches: - main paths: - "06-serverless-order-processing/**"
      - ".github/workflows/deploy-order-functions.yml"

env:
  AZURE_FUNCTIONAPP_NAME: orderprocessorfunc2026
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "06-serverless-order-processing"
  NODE_VERSION: "20.x"

jobs:
  build-and-deploy:
    rus-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: npm install

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}


